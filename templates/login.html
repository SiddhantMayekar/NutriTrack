<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | NutriTrack</title>

<!-- Bootstrap -->

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Bootstrap Icons -->

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<!-- CSS -->

<link rel="stylesheet"
href="{{ url_for('static', filename='css/login.css') }}">

</head>

<body class="login-body">

<div class="container-fluid">

<div class="row min-vh-100">

<!-- LEFT SIDE -->

<div class="col-lg-6 login-left">

<div class="text-center">

<img src="{{ url_for('static', filename='images/login.png') }}"
class="img-fluid login-image"
     alt="Welcome to NutriTrack">

<h1 class="mt-4 fw-bold">

Welcome to NutriTrack

</h1>

<p class="lead">

Track nutrition, water, BMI and healthy habits
all in one place.

</p>

</div>

</div>

<!-- RIGHT SIDE -->

<div class="col-lg-6 d-flex align-items-center justify-content-center">

<div class="login-card">

<div class="text-center mb-4">

<h2 class="fw-bold">

Welcome Back 👋

</h2>

<p class="text-muted">

Login to continue your health journey.

</p>

</div>

<form method="POST" action="{{ url_for('login') }}">
<div class="mb-3">

<label>Email Address</label>

<input
type="email"
class="form-control"
name="email"
placeholder="Enter your email"
required>

</div>

<div class="mb-3">

<label>Password</label>

<input
type="password"
class="form-control"
name="password"
placeholder="Enter password"
required>

</div>

<div class="d-flex justify-content-between align-items-center mb-4">

    

    <a href="#" class="text-success text-decoration-none">
        Forgot Password?
    </a>

</div>

<button
type="submit"
class="btn btn-success w-100 py-2">

Login

</button>

<hr class="my-4">

<button
type="button"
class="btn btn-outline-dark w-100 mb-3">

<i class="bi bi-google"></i>

Continue with Google

</button>

<button
type="button"
class="btn btn-outline-dark w-100">

<i class="bi bi-github"></i>

Continue with GitHub

</button>

<p class="text-center mt-4">

Don't have an account?

<a href="{{ url_for('register') }}">Register</a>

</p>

<p class="text-center">

<a
href="/"
class="text-decoration-none">

← Back to Home

</a>

</p>

</form>

</div>

</div>

</div>

</div>

</body>

</html>
