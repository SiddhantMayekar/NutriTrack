<div class="meal-card">

    <h3>{{ title }}</h3>

    {% if meals %}
        {% for meal in meals %}
        <div class="meal-row">

            <div class="meal-info">
                <h5>{{ meal.food_name }}</h5>
                <small class="text-muted">{{ meal.quantity }}</small>
            </div>

            <div class="meal-macros">
                <strong>{{ meal.calories }} kcal</strong>
                <small>
                    Protein {{ meal.protein }} g |
                    Carbs {{ meal.carbs }} g |
                    Fat {{ meal.fats }} g
                </small>

                <form action="{{ url_for('delete_meal', meal_id=meal.id) }}" method="POST">
                    <button class="btn btn-outline-danger btn-sm">
                        <i class="fa-solid fa-trash"></i>
                        Delete
                    </button>
                </form>
            </div>

        </div>
        {% endfor %}
    {% else %}
        <p class="text-muted mb-0">No meals added today.</p>
    {% endif %}

</div>
