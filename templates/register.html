<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | NutriTrack</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/register.css') }}">

</head>

<body class="register-page">

<div class="container-fluid">

<div class="row min-vh-100">

    <!-- Left Side -->

    <div class="col-lg-6 register-left">

        <img src="{{ url_for('static', filename='images/register.png') }}"
             class="register-image"
             alt="Register">

        <h1>Create Your Healthy Lifestyle</h1>

        <p>

            Join thousands of people improving their nutrition,
            hydration and fitness with NutriTrack.

        </p>

    </div>

    <!-- Right Side -->

    <div class="col-lg-6 d-flex align-items-center justify-content-center">

        <div class="register-card">

            <h2>Create Account 🎉</h2>

            <p class="text-muted mb-4">

                Start your health journey today.

            </p>

            <form method="POST" action="{{ url_for('register') }}">

                <div class="mb-3">

                    <label class="form-label">Full Name</label>

                    <input
                    type="text"
                    class="form-control"
                    name="full_name"
                    placeholder="Enter your full name"
                    required>

                </div>

                <div class="mb-3">

                    <label class="form-label">Email Address</label>

                    <input
                    type="email"
                    class="form-control"
                    name="email"
                    placeholder="Enter your email"
                    required>

                </div>

                <div class="mb-3">

    <label class="form-label">Password</label>

    <div class="password-box">

        <input
        type="password"
        class="form-control"
        id="password"
        name="password"
        placeholder="Create password"
        required>

        <i class="bi bi-eye-slash toggle-password"
           onclick="togglePassword('password', this)"></i>

    </div>
<div class="password-strength mt-2">

    <div class="strength-bar">

        <div id="strength-fill"></div>

    </div>

    <small id="strength-text" class="text-muted">
        Password Strength
    </small>

</div>
</div>

                <div class="mb-3">

    <label class="form-label">Confirm Password</label>

    <div class="password-box">

        <input
        type="password"
        class="form-control"
        id="confirmPassword"
        name="confirm_password"
        placeholder="Confirm password"
        required>
        <small id="password-match"></small>
        <i class="bi bi-eye-slash toggle-password"
           onclick="togglePassword('confirmPassword', this)"></i>

    </div>

</div>

                <div class="form-check mb-4">

                    <input
                    class="form-check-input"
                    type="checkbox"
                    id="terms">

                    <label
                    class="form-check-label"
                    for="terms">

                        I agree to the Terms & Conditions

                    </label>

                </div>

                <button
                class="btn btn-success w-100">

                    Create Account

                </button>

            </form>

            <hr>

            <p class="text-center">

                Already have an account?

                <a href="{{ url_for('login') }}">

                    Login

                </a>

            </p>

            <p class="text-center">

                <a href="{{ url_for('home') }}">

                    ← Back to Home

                </a>

            </p>

        </div>

    </div>

</div>

</div>
<script>

function togglePassword(id, icon){

    const input=document.getElementById(id);

    if(input.type==="password"){

        input.type="text";

        icon.classList.remove("bi-eye-slash");

        icon.classList.add("bi-eye");

    }

    else{

        input.type="password";

        icon.classList.remove("bi-eye");

        icon.classList.add("bi-eye-slash");

    }

}

// Password Strength

const password=document.getElementById("password");

const strengthFill=document.getElementById("strength-fill");

const strengthText=document.getElementById("strength-text");

password.addEventListener("input",()=>{

    const value=password.value;

    let strength=0;

    if(value.length>=8) strength++;

    if(/[A-Z]/.test(value)) strength++;

    if(/[0-9]/.test(value)) strength++;

    if(/[^A-Za-z0-9]/.test(value)) strength++;

    if(strength===1){

        strengthFill.style.width="25%";

        strengthFill.style.background="red";

        strengthText.innerHTML="Weak Password";

    }

    else if(strength===2){

        strengthFill.style.width="50%";

        strengthFill.style.background="orange";

        strengthText.innerHTML="Medium Password";

    }

    else if(strength===3){

        strengthFill.style.width="75%";

        strengthFill.style.background="#0dcaf0";

        strengthText.innerHTML="Good Password";

    }

    else if(strength===4){

        strengthFill.style.width="100%";

        strengthFill.style.background="#198754";

        strengthText.innerHTML="Strong Password";

    }

    else{

        strengthFill.style.width="0";

        strengthText.innerHTML="Password Strength";

    }

});

// Password Match

const confirmPassword=document.getElementById("confirmPassword");

const match=document.getElementById("password-match");

confirmPassword.addEventListener("input",()=>{

    if(confirmPassword.value===""){

        match.innerHTML="";

        return;

    }

    if(password.value===confirmPassword.value){

        match.innerHTML="✔ Passwords Match";

        match.style.color="#198754";

    }

    else{

        match.innerHTML="✖ Passwords Do Not Match";

        match.style.color="red";

    }

});

</script>
</body>

</html>
